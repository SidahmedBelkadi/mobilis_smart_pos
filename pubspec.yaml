name: mobilis_smart_pos
description: "Enabling Mobile Sales Channels through Digitalization and Automation"
publish_to: "none"

version: 2.0.1+1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.1
  flutter_screenutil: ^5.9.1
  dotted_border: ^2.1.0
  readmore: ^3.0.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  shared_preferences: ^2.2.3
  get_it: ^7.7.0
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  toastification: ^2.0.0
  image_picker: ^1.1.1
  intl: ^0.20.2
  http_parser: ^4.0.2
  flutter_staggered_animations: ^1.1.1
  skeletonizer: ^2.0.1
  typewritertext: ^3.0.6
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  salomon_bottom_bar: ^3.3.2
  path: ^1.9.0
  camera: ^0.10.6
  syncfusion_flutter_signaturepad: ^26.1.40
  jwt_decoder: ^2.0.1
  pretty_dio_logger: ^1.3.1
  pretty_bloc_observer: ^1.0.4
  flutter_secure_storage: ^9.2.2
  curved_navigation_bar: ^1.0.6
  font_awesome_flutter: ^10.7.0
  path_provider: ^2.1.3
  latlong2: ^0.9.1
  insta_image_viewer: ^1.0.4
  pdfx: ^2.6.0
  pinput: ^5.0.0
  diacritic: ^0.1.5
  encrypt: ^5.0.3
  google_mlkit_text_recognition: ^0.15.0
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.3
  rxdart: ^0.28.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  package_info_plus: ^4.0.0
  url_launcher: ^6.0.20
  flutter_switch: ^0.3.2
  carousel_slider: ^5.0.0
  dropdown_search: ^6.0.1
  json_pretty: ^1.0.4
  image: ^4.3.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_dotenv: ^5.2.1
  edge_detection_plus: ^1.0.2
  flutter_localizations:
    sdk: flutter
  screen_protector: ^1.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/mobilis.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/banners/
    - assets/lottie/
    - assets/json/
    - assets/gif/
    - assets/pdf/
    - assets/lang/fr/fr.json
    - assets/lang/ar/ar.json
    - assets/lang/en/en.json

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
